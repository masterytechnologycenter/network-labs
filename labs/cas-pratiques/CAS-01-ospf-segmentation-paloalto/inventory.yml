lab:
  id: CAS-01
  title: "Segmentation sécurisée avec OSPF multi-area et Palo Alto"
  ticket: "Une entreprise, deux sites, un datacenter et un partenaire qui ne doit joindre que l'application web. Sécurise le routage (ce qui est annoncé) et le pare-feu (ce qui est autorisé)."
  parcours: cas-pratiques
  niveau: Avancé
  ccna_v2: []
  plateforme: [PnetLab, EVE-NG]
  author: "Hilaire TCHOUATEU"
  source: "Matrice de câblage et plan d'adressage du PDF CAS-01_Lab-complet.pdf (network-labs), pages 4 à 6"
  note: "Inventaire de SCHÉMA (topology.png). Les configurations du lab sont dans le PDF ; elles ne sont pas encore extraites ici."

