# Kit Packet Tracer : python -X utf8 scripts/make_pt_kit.py labs/incidents/INC-05-etherchannel-on-lacp
packet_tracer:
  devices:
    DIST-SW: {model: "2960-24TT", kind: switch}
    ACC-1: {model: "2960-24TT", kind: switch}
    SRV-FICHIERS: {model: Server-PT, kind: server, ip: 10.5.10.10, mask: 255.255.255.0, gateway: 10.5.10.1}
    PC-1: {model: PC-PT, kind: pc, ip: 10.5.10.11, mask: 255.255.255.0, gateway: 10.5.10.1}
    PC-2: {model: PC-PT, kind: pc, ip: 10.5.10.12, mask: 255.255.255.0, gateway: 10.5.10.1}
  links:
    - [DIST-SW, GigabitEthernet0/1, ACC-1, GigabitEthernet0/1, croise]
    - [DIST-SW, GigabitEthernet0/2, ACC-1, GigabitEthernet0/2, croise]
    - [SRV-FICHIERS, FastEthernet0, DIST-SW, FastEthernet0/1]
    - [PC-1, FastEthernet0, ACC-1, FastEthernet0/1]
    - [PC-2, FastEthernet0, ACC-1, FastEthernet0/2]
  checks:
    - "Attendre 1 minute que les ports des switchs passent au vert (ou à l'orange s'ils sont bloqués)"
    - "Depuis PC-1 : ping 10.5.10.10 (SRV-FICHIERS) : noter le résultat"
    - "Sur ACC-1 et sur DIST-SW : show etherchannel summary : noter les lettres entre parenthèses de Po1, Gi0/1 et Gi0/2"
  observe:
    - "Sur DIST-SW : show lacp neighbor : aucun voisin LACP tant qu'ACC-1 est en mode on"
    - "Après la correction (ACC-1 en mode active), sur les deux switchs : show etherchannel summary : Po1(SU), Gi0/1(P) et Gi0/2(P)"
    - "Depuis PC-1 : ping 10.5.10.10 : réussi"
  notes:   # rappel, non lu par make_pt_kit.py
    - "Le 2960 de Packet Tracer refuse switchport trunk encapsulation dot1q : ligne retirée du kit Packet Tracer, gardée dans les configs PnetLab (vIOS L2 l'exige)."
    - "spanning-tree portfast edge (vIOS L2) remplacé par spanning-tree portfast (syntaxe du 2960 de Packet Tracer)."
    - "Ports : Gi0/1 et Gi0/2 identiques ; Gi0/3 de DIST-SW = FastEthernet0/1 ; Gi0/3 et Gi1/0 d'ACC-1 = FastEthernet0/1 et 0/2."
    - "Le comportement de Packet Tracer face à on contre active n'est pas garanti identique à celui d'IOS : les vérifications notent ce qu'on voit, sans l'imposer."
configs:   # pt_initial / pt_final : versions Packet Tracer des configs de configs/initial et configs/final
  DIST-SW:
    pt_initial: |
        hostname DIST-SW
        no ip domain-lookup
        !
        spanning-tree mode rapid-pvst
        spanning-tree vlan 10 priority 4096
        !
        vlan 10
         name BUREAUX
        !
        interface range GigabitEthernet0/1 - 2
         description Vers ACC-1
         switchport mode trunk
         channel-group 1 mode active
        !
        interface Port-channel1
         description Vers ACC-1 (2 x 1 Gbit/s)
         switchport mode trunk
        !
        ! Fa0/1 ici = Gi0/3 du lab PnetLab
        interface FastEthernet0/1
         description SRV-FICHIERS
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface Vlan10
         ip address 10.5.10.1 255.255.255.0
         no shutdown
        !
        line con 0
         logging synchronous
        !
    pt_final: |
        hostname DIST-SW
        no ip domain-lookup
        !
        spanning-tree mode rapid-pvst
        spanning-tree vlan 10 priority 4096
        !
        vlan 10
         name BUREAUX
        !
        interface range GigabitEthernet0/1 - 2
         description Vers ACC-1
         switchport mode trunk
         channel-group 1 mode active
        !
        interface Port-channel1
         description Vers ACC-1 (2 x 1 Gbit/s)
         switchport mode trunk
        !
        ! Fa0/1 ici = Gi0/3 du lab PnetLab
        interface FastEthernet0/1
         description SRV-FICHIERS
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface Vlan10
         ip address 10.5.10.1 255.255.255.0
         no shutdown
        !
        line con 0
         logging synchronous
        !
  ACC-1:
    pt_initial: |
        hostname ACC-1
        no ip domain-lookup
        !
        spanning-tree mode rapid-pvst
        !
        vlan 10
         name BUREAUX
        !
        interface range GigabitEthernet0/1 - 2
         description Vers DIST-SW
         switchport mode trunk
         channel-group 1 mode on
        !
        interface Port-channel1
         description Vers DIST-SW (2 x 1 Gbit/s)
         switchport mode trunk
        !
        ! Fa0/1 et Fa0/2 ici = Gi0/3 et Gi1/0 du lab PnetLab
        interface FastEthernet0/1
         description PC-1
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface FastEthernet0/2
         description PC-2
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface Vlan10
         ip address 10.5.10.2 255.255.255.0
         no shutdown
        !
        line con 0
         logging synchronous
        !
    pt_final: |
        hostname ACC-1
        no ip domain-lookup
        !
        spanning-tree mode rapid-pvst
        !
        vlan 10
         name BUREAUX
        !
        interface range GigabitEthernet0/1 - 2
         description Vers DIST-SW
         switchport mode trunk
         channel-group 1 mode active
        !
        interface Port-channel1
         description Vers DIST-SW (2 x 1 Gbit/s)
         switchport mode trunk
        !
        ! Fa0/1 et Fa0/2 ici = Gi0/3 et Gi1/0 du lab PnetLab
        interface FastEthernet0/1
         description PC-1
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface FastEthernet0/2
         description PC-2
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface Vlan10
         ip address 10.5.10.2 255.255.255.0
         no shutdown
        !
        line con 0
         logging synchronous
        !
