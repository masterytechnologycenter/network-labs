lab:
  id: INC-05
  title: "EtherChannel qui ne monte pas : mode on contre LACP active"
  ticket: "Lundi 8 h 05. Le switch d'accès du 2e étage a été remplacé cette nuit. Plus aucun poste de l'étage n'accède au serveur de fichiers. Les deux câbles vers la distribution sont bien branchés."
  ticket_label: "TICKET INC-05 · P1"
  parcours: incidents
  niveau: CCNA
  ccna_v2: ["2.1"]   # numérotation de la formation CCNA v2 du dépôt (comme LAB-2.1-etherchannel)
  plateforme: [PnetLab, EVE-NG]
  author: "Hilaire TCHOUATEU"
  video: ""
  verifie: "05/11/2026 · PnetLab · vIOS L2 15.2(20200924) · captures docs/masterytech/tests-lab/TEST-INC05/resultats.txt (panne, correction, passive+passive)"
  zip: "https://github.com/masterytechnologycenter/network-labs/releases/download/INC-05/INC-05-etherchannel-on-lacp.zip"

nodes:
  - name: DIST-SW
    image: "vIOS L2"
    interfaces:
      GigabitEthernet0/1: "Po1 · LACP active"   # vers ACC-1 Gi0/1
      GigabitEthernet0/2: "Po1 · LACP active"   # vers ACC-1 Gi0/2
      GigabitEthernet0/3: access VLAN 10        # vers SRV-FICHIERS eth0
      Vlan10: 10.5.10.1/24
  - name: ACC-1
    image: "vIOS L2"
    note: "Switch d'accès remplacé pendant la nuit : la panne est ici"
    interfaces:
      GigabitEthernet0/1: "Po1 · mode on (la panne)"   # vers DIST-SW Gi0/1
      GigabitEthernet0/2: "Po1 · mode on (la panne)"   # vers DIST-SW Gi0/2
      GigabitEthernet0/3: access VLAN 10               # vers PC-1 eth0
      GigabitEthernet1/0: access VLAN 10               # vers PC-2 eth0
      Vlan10: 10.5.10.2/24
  - {name: SRV-FICHIERS, image: VPCS, ip: 10.5.10.10/24, gateway: 10.5.10.1}
  - {name: PC-1, image: VPCS, ip: 10.5.10.11/24, gateway: 10.5.10.1}
  - {name: PC-2, image: VPCS, ip: 10.5.10.12/24, gateway: 10.5.10.1}

