lab:
  id: DEB-01
  title: "Switch ou routeur : qui fait quoi ?"
  ticket: "Relie deux réseaux avec un routeur, puis observe : la table MAC qui se remplit, le rôle de la passerelle et les adresses MAC qui changent à chaque saut."
  ticket_label: "MISSION"
  parcours: debutants
  niveau: "Débutant (CCNA)"
  ccna_v2: ["2.1"]
  plateforme: [Packet Tracer, PnetLab, EVE-NG]
  author: "Hilaire TCHOUATEU"
  video: ""
  zip: ""

nodes:
  - name: R1
    image: "IOL L3"
    interfaces:
      Ethernet0/0: 192.168.10.1/24   # vers SW1 e0/0 (G0/0 dans la vidéo)
      Ethernet0/1: 192.168.20.1/24   # vers SW2 e0/0 (G0/1 dans la vidéo)
  - name: SW1
    image: "IOL L2"
    interfaces:
      Ethernet0/0: "vers R1 e0/0"
      Ethernet0/1: "vers PC1 eth0"
      Ethernet0/2: "vers PC3 eth0"
  - name: SW2
    image: "IOL L2"
    interfaces:
      Ethernet0/0: "vers R1 e0/1"
      Ethernet0/1: "vers PC2 eth0"
  - {name: PC1, image: VPCS, ip: 192.168.10.10/24, gateway: 192.168.10.1}
  - {name: PC3, image: VPCS, ip: 192.168.10.30/24, gateway: 192.168.10.1}
  - {name: PC2, image: VPCS, ip: 192.168.20.20/24, gateway: 192.168.20.1}

