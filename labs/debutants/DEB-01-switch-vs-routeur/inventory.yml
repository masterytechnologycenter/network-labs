# Kit Packet Tracer : python scripts/make_pt_kit.py labs/debutants/DEB-01-switch-vs-routeur
packet_tracer:
  devices:
    R1:
      model: "2911"
      kind: router
      config: |
        hostname R1
        interface GigabitEthernet0/0
         description LAN 192.168.10.0/24 vers SW1
         ip address 192.168.10.1 255.255.255.0
         no shutdown
        interface GigabitEthernet0/1
         description LAN 192.168.20.0/24 vers SW2
         ip address 192.168.20.1 255.255.255.0
         no shutdown
    SW1: {model: "2960-24TT", kind: switch, config: "hostname SW1"}
    SW2: {model: "2960-24TT", kind: switch, config: "hostname SW2"}
    PC1: {model: PC-PT, kind: pc, ip: 192.168.10.10, mask: 255.255.255.0, gateway: 192.168.10.1}
    PC3: {model: PC-PT, kind: pc, ip: 192.168.10.30, mask: 255.255.255.0, gateway: 192.168.10.1}
    PC2: {model: PC-PT, kind: pc, ip: 192.168.20.20, mask: 255.255.255.0, gateway: 192.168.20.1}
  links:
    - [PC1, FastEthernet0, SW1, FastEthernet0/1]
    - [PC3, FastEthernet0, SW1, FastEthernet0/3]
    - [SW1, GigabitEthernet0/1, R1, GigabitEthernet0/0]
    - [R1, GigabitEthernet0/1, SW2, GigabitEthernet0/1]
    - [PC2, FastEthernet0, SW2, FastEthernet0/1]
  checks:
    - "Tous les voyants des câbles sont verts (attendre 30 s que les ports des switchs passent en vert)"
    - "Depuis PC1 : ping 192.168.10.30 (PC3, même réseau) → réussi"
    - "Depuis PC1 : ping 192.168.20.20 (PC2, autre réseau) → réussi (le premier essai peut échouer, le temps de l'ARP)"
    - "Sur R1 : show ip route → deux réseaux connectés (C) 192.168.10.0/24 et 192.168.20.0/24"
  observe:
    - "Passe en mode Simulation (en bas à droite), filtre sur ICMP et ARP."
    - "Depuis PC1, ping 192.168.10.30 : la requête ARP part sur tous les ports de SW1 (l'inondation), puis la réponse revient directement."
    - "Sur SW1 : show mac-address-table → PC1 et PC3 y sont, avec leur port."
    - "Depuis PC1, ping 192.168.20.20 : clique sur l'enveloppe à chaque saut. Entre PC1 et R1, la MAC de destination est celle de R1 G0/0 ; entre R1 et PC2, c'est celle de PC2. L'IP de destination reste 192.168.20.20 du début à la fin."
