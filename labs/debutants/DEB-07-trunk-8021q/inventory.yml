# Kit Packet Tracer (ajouté le 30/10/2026 pour scripts/make_pt_kit.py ; la topologie PnetLab ci-dessus est inchangée).
# Ports adaptés au switch 2960-24TT de Packet Tracer : Gi0/0 (trunk) -> GigabitEthernet0/1 ; Gi0/1-3 (accès) -> FastEthernet0/1-3.
packet_tracer:
  devices:
    ACC-1: {model: "2960-24TT", kind: switch}
    ACC-2: {model: "2960-24TT", kind: switch}
    COMPTA-1: {model: PC-PT, kind: pc, ip: 192.168.10.11, mask: 255.255.255.0}
    RH-1: {model: PC-PT, kind: pc, ip: 192.168.20.11, mask: 255.255.255.0}
    INVITE-1: {model: PC-PT, kind: pc, ip: 192.168.30.11, mask: 255.255.255.0}
    COMPTA-2: {model: PC-PT, kind: pc, ip: 192.168.10.12, mask: 255.255.255.0}
    RH-2: {model: PC-PT, kind: pc, ip: 192.168.20.12, mask: 255.255.255.0}
    INVITE-2: {model: PC-PT, kind: pc, ip: 192.168.30.12, mask: 255.255.255.0}
  links:
    - [ACC-1, GigabitEthernet0/1, ACC-2, GigabitEthernet0/1]
    - [COMPTA-1, FastEthernet0, ACC-1, FastEthernet0/1]
    - [RH-1, FastEthernet0, ACC-1, FastEthernet0/2]
    - [INVITE-1, FastEthernet0, ACC-1, FastEthernet0/3]
    - [COMPTA-2, FastEthernet0, ACC-2, FastEthernet0/1]
    - [RH-2, FastEthernet0, ACC-2, FastEthernet0/2]
    - [INVITE-2, FastEthernet0, ACC-2, FastEthernet0/3]
  checks:
    - "Tous les voyants des câbles sont verts (attendre 30 s que les ports des switchs passent au vert)"
    - "Depuis COMPTA-1 : ping 192.168.10.12 (COMPTA-2) → échec : c'est le symptôme"
    - "Sur ACC-1 : show interfaces trunk → aucune ligne (le lien GigabitEthernet0/1 est en mode accès)"
  observe:
    - "Après la correction, sur ACC-1 : show interfaces trunk → Gig0/1 en trunk 802.1q, VLAN natif 99, VLAN autorisés 10,20,30,99"
    - "Depuis COMPTA-1 : ping 192.168.10.12 → réussi ; idem RH-1 vers RH-2 (192.168.20.12) et INVITE-1 vers INVITE-2 (192.168.30.12)"
    - "Mode Simulation, filtre ICMP : clique sur l'enveloppe entre les deux switchs pour voir l'étiquette 802.1Q (VLAN 10)"
  notes:   # rappel, non lu par make_pt_kit.py : repris à la main dans docs/PACKET-TRACER.md
    - "Le 2960 de Packet Tracer refuse switchport trunk encapsulation dot1q (802.1Q seulement) : ligne retirée du kit Packet Tracer, gardée dans les configs PnetLab (vIOS L2 l'accepte)."
    - "spanning-tree portfast edge (vIOS L2) remplacé par spanning-tree portfast (syntaxe du 2960 de Packet Tracer)."
    - "Ports : Gi0/0 du lab PnetLab = GigabitEthernet0/1 dans Packet Tracer ; Gi0/1 à Gi0/3 = FastEthernet0/1 à 0/3."
configs:   # pt_initial / pt_final : versions Packet Tracer des configs de configs/initial et configs/final
  ACC-1:
    pt_initial: |
        hostname ACC-1
        no ip domain-lookup
        !
        vlan 10
         name COMPTA
        vlan 20
         name RH
        vlan 30
         name INVITES
        vlan 99
         name NATIF
        !
        ! Gi0/1 ici = Gi0/0 du lab PnetLab (lien vers l'autre switch)
        interface GigabitEthernet0/1
         description LIEN-VERS-ACC-2
         switchport mode access
        !
        interface FastEthernet0/1
         description COMPTA
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface FastEthernet0/2
         description RH
         switchport mode access
         switchport access vlan 20
         spanning-tree portfast
        !
        interface FastEthernet0/3
         description INVITES
         switchport mode access
         switchport access vlan 30
         spanning-tree portfast
        !
        line con 0
         logging synchronous
        !
    pt_final: |
        hostname ACC-1
        no ip domain-lookup
        !
        vlan 10
         name COMPTA
        vlan 20
         name RH
        vlan 30
         name INVITES
        vlan 99
         name NATIF
        !
        ! Gi0/1 ici = Gi0/0 du lab PnetLab (lien vers l'autre switch)
        interface GigabitEthernet0/1
         description LIEN-VERS-ACC-2
         switchport mode trunk
         switchport trunk native vlan 99
         switchport trunk allowed vlan 10,20,30,99
        !
        interface FastEthernet0/1
         description COMPTA
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface FastEthernet0/2
         description RH
         switchport mode access
         switchport access vlan 20
         spanning-tree portfast
        !
        interface FastEthernet0/3
         description INVITES
         switchport mode access
         switchport access vlan 30
         spanning-tree portfast
        !
        line con 0
         logging synchronous
        !
  ACC-2:
    pt_initial: |
        hostname ACC-2
        no ip domain-lookup
        !
        vlan 10
         name COMPTA
        vlan 20
         name RH
        vlan 30
         name INVITES
        vlan 99
         name NATIF
        !
        ! Gi0/1 ici = Gi0/0 du lab PnetLab (lien vers l'autre switch)
        interface GigabitEthernet0/1
         description LIEN-VERS-ACC-1
         switchport mode access
        !
        interface FastEthernet0/1
         description COMPTA
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface FastEthernet0/2
         description RH
         switchport mode access
         switchport access vlan 20
         spanning-tree portfast
        !
        interface FastEthernet0/3
         description INVITES
         switchport mode access
         switchport access vlan 30
         spanning-tree portfast
        !
        line con 0
         logging synchronous
        !
    pt_final: |
        hostname ACC-2
        no ip domain-lookup
        !
        vlan 10
         name COMPTA
        vlan 20
         name RH
        vlan 30
         name INVITES
        vlan 99
         name NATIF
        !
        ! Gi0/1 ici = Gi0/0 du lab PnetLab (lien vers l'autre switch)
        interface GigabitEthernet0/1
         description LIEN-VERS-ACC-1
         switchport mode trunk
         switchport trunk native vlan 99
         switchport trunk allowed vlan 10,20,30,99
        !
        interface FastEthernet0/1
         description COMPTA
         switchport mode access
         switchport access vlan 10
         spanning-tree portfast
        !
        interface FastEthernet0/2
         description RH
         switchport mode access
         switchport access vlan 20
         spanning-tree portfast
        !
        interface FastEthernet0/3
         description INVITES
         switchport mode access
         switchport access vlan 30
         spanning-tree portfast
        !
        line con 0
         logging synchronous
        !
